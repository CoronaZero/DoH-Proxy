name: Build and Release Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # Checkout
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==============================
      # Setup Node.js
      # ==============================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==============================
      # Install Terser
      # ==============================
      - name: Install Terser
        run: npm install --no-save terser@latest

      # ==============================
      # Create output directory
      # ==============================
      - name: Prepare output
        run: mkdir -p dist

      # ==============================
      # Minify worker.js
      # ==============================
      - name: Minify worker.js
        run: |
          npx terser worker.js \
            --compress \
            --mangle \
            --output dist/worker.min.js

      # ==============================
      # Generate release information
      # ==============================
      - name: Generate release information
        id: release_info
        run: |
          VERSION=$(TZ=Asia/Shanghai date +'%y.%-m.%-d')

          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)

          COMMIT_TIME=$(TZ=Asia/Shanghai git log -1 --date=format:'%Y-%m-%d %H:%M:%S %Z' --format='%ad')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_message=$COMMIT_MESSAGE" >> "$GITHUB_OUTPUT"
          echo "commit_time=$COMMIT_TIME" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"
          echo "Commit: $COMMIT_SHA"
          echo "Short commit: $SHORT_SHA"
          echo "Commit message: $COMMIT_MESSAGE"
          echo "Commit time: $COMMIT_TIME"

      # ==============================
      # Show generated file
      # ==============================
      - name: Show build result
        run: |
          ls -lh worker.js
          ls -lh dist/worker.min.js

      # ==============================
      # Generate Release notes
      # ==============================
      - name: Generate Release notes
        id: notes
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
          COMMIT_SHA: ${{ steps.release_info.outputs.commit_sha }}
          SHORT_SHA: ${{ steps.release_info.outputs.short_sha }}
          COMMIT_MESSAGE: ${{ steps.release_info.outputs.commit_message }}
          COMMIT_TIME: ${{ steps.release_info.outputs.commit_time }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > release_notes.md <<EOF
          ## Build Information

          | Item | Value |
          | --- | --- |
          | Version | \`$VERSION\` |
          | Commit | [\`$SHORT_SHA\`](https://github.com/$REPOSITORY/commit/$COMMIT_SHA) |
          | Commit SHA | \`$COMMIT_SHA\` |
          | Commit time | $COMMIT_TIME |
          | Commit message | $COMMIT_MESSAGE |

          ## Artifact

          - \`worker.min.js\` — Minified Cloudflare Worker

          This release was built automatically from commit [$SHORT_SHA](https://github.com/$REPOSITORY/commit/$COMMIT_SHA).
          EOF

          cat release_notes.md

      # ==============================
      # Create or update GitHub Release
      # ==============================
      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."

            gh release upload \
              "$VERSION" \
              dist/worker.min.js \
              --clobber

            gh release edit \
              "$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.md

          else
            echo "Creating Release $VERSION."

            gh release create \
              "$VERSION" \
              dist/worker.min.js \
              --title "$VERSION" \
              --notes-file release_notes.md
          fi
